<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAG 后台管理</title><link rel="stylesheet" href="/static/styles.css"></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark">R</span><span>Enterprise Policy RAG<small>Administration</small></span></a><nav><a href="/">用户端</a><a class="active" href="/admin">后台管理</a></nav><button class="link-button" onclick="logout()">退出登录</button></header><main class="admin-shell"><section class="admin-header"><div><p class="eyebrow">ACCESS GOVERNANCE CONSOLE</p><h1>用户权限管理</h1><p>审批注册申请，并按业务角色授予最小必要的知识库访问范围。</p></div><button class="secondary" onclick="loadAdmin()">刷新数据</button></section><div id="adminMessage" class="form-message hidden"></div><section class="admin-grid"><article class="panel admin-panel"><div class="panel-head"><div><p class="section-kicker">PENDING & ACTIVE</p><h2>用户申请</h2></div><span id="userCount" class="count-badge">0</span></div><div id="users" class="user-list">加载中…</div></article><aside class="panel admin-panel"><div class="panel-head"><div><p class="section-kicker">AUDIT TRAIL</p><h2>审计记录</h2></div></div><div id="audit" class="audit-list">加载中…</div></aside></section><section class="panel admin-panel"><div class="panel-head"><div><p class="section-kicker">KNOWLEDGE SCOPE</p><h2>已索引知识资产</h2></div></div><div id="documents" class="document-grid">加载中…</div></section></main><script>
const labels={guest:'访客',engineering:'工程部',finance:'财务部',insurance:'保险与风险',executive:'管理层'}; const esc=v=>{const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML};
async function api(url,options={}){const r=await fetch(url,{headers:{'content-type':'application/json'},...options});const d=await r.json();if(!r.ok)throw new Error(d.detail||'请求未完成');return d}
function notice(text,error=false){const n=document.getElementById('adminMessage');n.textContent=text;n.className=`form-message ${error?'error':''}`}
function userCard(u){if(u.is_admin)return `<article class="user-row"><div><b>${esc(u.username)}</b><small>系统管理员 · ${u.must_change_password?'需修改初始密码':'已激活'}</small></div><span class="status-chip active">管理员</span></article>`;const options=Object.entries(labels).map(([v,l])=>`<option value="${v}" ${u.role===v?'selected':''}>${l}</option>`).join('');return `<article class="user-row"><div><b>${esc(u.username)}</b><small>申请时间：${new Date(u.created_at).toLocaleString()}</small></div><div class="access-control"><select id="role-${u.id}">${options}</select><button class="primary compact" onclick="saveAccess(${u.id},true)">${u.status==='pending'?'批准':'更新'}</button><button class="secondary compact" onclick="saveAccess(${u.id},false)">停用</button></div><span class="status-chip ${esc(u.status)}">${u.status==='pending'?'待审批':u.status==='active'?'已启用':'已停用'}</span></article>`}
async function saveAccess(id,enabled){try{const role=document.getElementById(`role-${id}`).value;await api(`/api/admin/users/${id}/access`,{method:'PUT',body:JSON.stringify({role,enabled})});notice(enabled?'权限已分配，用户可刷新进入问答。':'账号已停用。');loadAdmin();}catch(e){notice(e.message,true)}}
async function loadAdmin(){try{const me=await api('/api/auth/me');if(!me.authenticated||!me.user.is_admin||me.user.must_change_password){location.href='/';return}const [users,audit,documents]=await Promise.all([api('/api/admin/users'),api('/api/admin/audit'),api('/api/admin/documents')]);document.getElementById('userCount').textContent=users.filter(u=>!u.is_admin).length;document.getElementById('users').innerHTML=users.map(userCard).join('');document.getElementById('audit').innerHTML=audit.length?audit.map(a=>`<article class="audit-row"><b>${esc(a.action)}</b><span>${esc(a.actor||'system')} → ${esc(a.target||'—')}</span><small>${new Date(a.created_at).toLocaleString()}</small></article>`).join(''):'暂无记录';document.getElementById('documents').innerHTML=documents.map(d=>`<article class="document-card"><b>${esc(d.doc_id)}</b><span>${esc(d.title)}</span><small>${esc(d.department)} · ${d.allowed_roles.map(r=>labels[r]).join('、')}</small></article>`).join('');}catch(e){notice(e.message,true)}}
async function logout(){await api('/api/auth/logout',{method:'POST'});location.href='/'}loadAdmin();
</script></body></html>
