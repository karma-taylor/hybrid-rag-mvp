<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>X-Ray</title><link rel="stylesheet" href="/static/styles.css"></head><body><nav><b>Enterprise Policy RAG</b><a href="/">员工问答</a><a href="/xray">X-Ray 溯源</a><a href="/admin">知识治理</a></nav><main class="wrap"><h1>X-Ray 白盒透视</h1><p class="muted">用角色切换证明权限隔离；右侧展示仅对当前角色可见的原始证据和融合分数。</p><div class="grid"><section class="panel"><h2>验证问题</h2><div class="role"><button data-role="guest" onclick="selectRole('guest')">访客</button><button data-role="engineering" onclick="selectRole('engineering')">工程部</button><button data-role="finance" onclick="selectRole('finance')">财务部</button><button data-role="insurance" onclick="selectRole('insurance')">保险与风险</button><button data-role="executive" onclick="selectRole('executive')">管理层</button></div><div id="chat"><div class="msg assistant">建议先以“访客”提问“差旅费用多久内提交报销？”，再切换“财务部”重复提问。</div></div><div class="send"><input id="question" placeholder="输入同一问题进行权限对比"><button class="primary" onclick="ask()">执行</button></div></section><aside class="panel"><h2>检索证据面板</h2><div id="evidence"></div></aside></div></main><script src="/static/app.js"></script></body></html>
