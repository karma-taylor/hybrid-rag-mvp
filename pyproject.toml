[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
# test_retrieval.py is an on-demand, model-loading evaluation CLI—not a test.
addopts = "-ra --ignore=test_retrieval.py"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["enterprise_api", "eval_pipeline", "rag_runtime"]
